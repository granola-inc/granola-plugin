name: Validate configuration

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate JSON
        run: |
          python3 -I - <<'PY'
          import json

          def reject_constant(value):
              raise ValueError(f"Invalid JSON constant: {value}")

          for path in (".antigravity-plugin/plugin.json", "mcp_config.json"):
              with open(path, encoding="utf-8") as file:
                  json.load(file, parse_constant=reject_constant)
          PY


      - name: Check Marketplace fields
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          with open(".antigravity-plugin/plugin.json", encoding="utf-8") as file:
              manifest = json.load(file)

          required = ["name", "displayName", "description", "logo", "suggestedPrompts", "version", "author"]
          missing = [field for field in required if not manifest.get(field)]
          if missing:
              sys.exit(f"plugin.json is missing fields the Marketplace requires: {', '.join(missing)}")

          if not manifest["logo"].startswith("https://") and not os.path.isfile(manifest["logo"]):
              sys.exit(f"plugin.json logo {manifest['logo']!r} does not exist")
          PY
